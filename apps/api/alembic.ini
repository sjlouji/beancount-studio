# Developer CLI configuration only, e.g. `uv run alembic revision --autogenerate --rev-id 0002 -m "add workspaces"`.
# The application runs migrations itself at startup (app/db/base.py) and the database URL comes
# from the application settings, not from this file.
[alembic]
script_location = app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
