<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Connect · Beancount Studio</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Beancount Studio</p>
      <h1>Connect to your server</h1>
      <p class="lede">
        Enter the address of the Beancount Studio instance you use. You sign in there, in this
        window, and the app remembers the server.
      </p>
      <form id="connect-form" novalidate>
        <label for="server-url">Server address</label>
        <input
          id="server-url"
          name="url"
          type="text"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="studio.example.com"
          autofocus
          required
        />
        <p id="error" class="error" role="alert" hidden></p>
        <button type="submit" id="connect-button">Connect</button>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
