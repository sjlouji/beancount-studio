# Beancount Studio — production stack (single host, Caddy with automatic TLS).
#
#   ./studio.sh prod                      # from the repo root; creates deploy/.env on first run
#   ./studio.sh local                     # same images without TLS (adds docker-compose.local.yml)
#   or: docker compose -f docker-compose.prod.yml up -d --build
#
# Open-source models: `./studio.sh prod --profile ollama up -d --build` adds an Ollama server on
# the internal network. In .env set BS_OPENAI_BASE_URL=http://ollama:11434/v1 and
# BS_AI_MODEL=<model>, then pull it once: `./studio.sh prod exec ollama ollama pull <model>`.
#
# Caddy terminates TLS for $DOMAIN (automatic certificates) and routes /api/* to the API
# and everything else to the web app. Ledger repositories and uploads live in the `studio-data`
# volume; metadata lives in PostgreSQL (`postgres-data` volume). The API runs its database
# migrations at startup.

name: beancount-studio

services:
  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      BS_DATA_DIR: /data
      BS_DATABASE_URL: postgresql+asyncpg://studio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/studio
      BS_PUBLIC_URL: ${BS_PUBLIC_URL:-https://${DOMAIN:-localhost}}
      BS_CORS_ORIGINS: ${BS_PUBLIC_URL:-https://${DOMAIN:-localhost}}
      BS_COOKIE_SECURE: ${BS_COOKIE_SECURE:-true}
    volumes:
      - studio-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "5432"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    # GPU (NVIDIA): uncomment after installing the NVIDIA container toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  studio-data:
  postgres-data:
  caddy-data:
  caddy-config:
  ollama-models:
