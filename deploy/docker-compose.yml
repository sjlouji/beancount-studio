# Beancount Studio — single-host deployment.
#
#   cp .env.example .env   # set BS_SECRET_KEY, DOMAIN, optional BS_ANTHROPIC_API_KEY
#   docker compose up -d --build
#
# Caddy terminates TLS for $DOMAIN (automatic certificates) and routes /api/* to the API
# and everything else to the web app. Ledger repositories, uploads and the SQLite database
# live in the `studio-data` volume.

name: beancount-studio

services:
  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      BS_DATA_DIR: /data
      BS_PUBLIC_URL: ${BS_PUBLIC_URL:-https://${DOMAIN:-localhost}}
      BS_CORS_ORIGINS: ${BS_PUBLIC_URL:-https://${DOMAIN:-localhost}}
      BS_COOKIE_SECURE: ${BS_COOKIE_SECURE:-true}
    volumes:
      - studio-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  studio-data:
  caddy-data:
  caddy-config:
