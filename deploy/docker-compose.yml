# Beancount Studio — single-host deployment.
#
#   cp .env.example .env   # set BS_SECRET_KEY, DOMAIN, and optionally an AI provider
#   docker compose up -d --build
#
# Open-source models: `docker compose --profile ollama up -d --build` adds an Ollama server on
# the internal network. In .env set BS_OPENAI_BASE_URL=http://ollama:11434/v1 and
# BS_AI_MODEL=<model>, then pull it once: `docker compose exec ollama ollama pull <model>`.
#
# Caddy terminates TLS for $DOMAIN (automatic certificates) and routes /api/* to the API
# and everything else to the web app. Ledger repositories, uploads and the SQLite database
# live in the `studio-data` volume.

name: beancount-studio

services:
  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      BS_DATA_DIR: /data
      BS_PUBLIC_URL: ${BS_PUBLIC_URL:-https://${DOMAIN:-localhost}}
      BS_CORS_ORIGINS: ${BS_PUBLIC_URL:-https://${DOMAIN:-localhost}}
      BS_COOKIE_SECURE: ${BS_COOKIE_SECURE:-true}
    volumes:
      - studio-data:/data
    expose:
      - "8000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    # GPU (NVIDIA): uncomment after installing the NVIDIA container toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  studio-data:
  caddy-data:
  caddy-config:
  ollama-models:
