# Local trial without TLS:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# then open http://localhost:8080
services:
  caddy:
    ports: !override
      - "8080:80"
    environment:
      DOMAIN: ":80"
  api:
    environment:
      BS_PUBLIC_URL: http://localhost:8080
      BS_CORS_ORIGINS: http://localhost:8080
      BS_COOKIE_SECURE: "false"
