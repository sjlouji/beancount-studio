# Override for docker-compose.prod.yml: production images on this machine, served by Caddy over
# HTTPS with certificates from its own local certificate authority.
#   ./studio.sh local            → https://localhost:8443 (BS_LOCAL_PORT in .env changes the port)
#   ./studio.sh local trust      trusts Caddy's local root certificate once (macOS keychain)
#   or: docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
services:
  caddy:
    ports: !override
      - "${BS_LOCAL_PORT:-8443}:443"
    environment:
      DOMAIN: localhost
  api:
    environment:
      BS_PUBLIC_URL: https://localhost:${BS_LOCAL_PORT:-8443}
      BS_CORS_ORIGINS: https://localhost:${BS_LOCAL_PORT:-8443}
